<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Driver Timer v1.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">DRIVER TIMER</p>
      <h1>拘束時間管理</h1>
    </div>
    <time id="clock">--:--:--</time>
  </header>

  <nav class="tabs" aria-label="画面切替">
    <button class="tab active" data-view="timer" type="button">タイマー</button>
    <button class="tab" data-view="calendar" type="button">カレンダー</button>
  </nav>

  <main>
    <section id="timerView" class="view active">
      <section class="status-card">
        <div class="status-top">
          <span id="statusBadge" class="badge idle">待機中</span>
          <span id="remainingText">始業してください</span>
        </div>
        <div class="primary-time">
          <span>拘束時間</span>
          <strong id="restraintTime">00:00:00</strong>
        </div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <div class="metrics">
          <div><span>経過</span><strong id="elapsedTime">00:00:00</strong></div>
          <div><span>業務</span><strong id="workTime">00:00:00</strong></div>
          <div><span>休憩</span><strong id="breakTime">00:00:00</strong></div>
          <div><span>有効休息</span><strong id="validRestTime">00:00:00</strong></div>
        </div>
      </section>

      <section id="managerPanel" class="manager-panel hidden">
        <div>
          <strong>営業所長への連絡が必要です</strong>
          <p id="managerText">拘束時間が13時間を超えました。</p>
        </div>
        <button id="managerButton" type="button">連絡済みにする</button>
      </section>

      <section class="controls" aria-label="勤務操作">
        <button id="startButton" class="btn primary full" type="button">始業する</button>
        <div id="workControls" class="control-grid hidden">
          <button id="breakButton" class="btn" type="button">休憩</button>
          <button id="restButton" class="btn" type="button">休息</button>
          <button id="resumeButton" class="btn" type="button">業務再開</button>
          <button id="endButton" class="btn danger" type="button">終業する</button>
        </div>
        <button id="resetButton" class="text-button" type="button">現在の記録をリセット</button>
      </section>

      <section class="timeline-card">
        <div class="section-heading">
          <h2>本日の記録</h2>
          <span>時刻を押すと編集できます</span>
        </div>
        <div id="timeline" class="timeline empty">記録はありません</div>
      </section>
    </section>

    <section id="calendarView" class="view">
      <section class="calendar-card">
        <div class="calendar-header">
          <button id="prevMonth" type="button" aria-label="前月">‹</button>
          <h2 id="monthTitle"></h2>
          <button id="nextMonth" type="button" aria-label="次月">›</button>
        </div>
        <button id="todayButton" class="text-button" type="button">今月に戻る</button>
        <div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>
      <section class="history-card">
        <h2>勤務履歴</h2>
        <div id="historyList" class="history-list empty">履歴はありません</div>
      </section>
    </section>
  </main>

  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">
      <h2 id="editTitle">記録を編集</h2>
      <p id="editLabel"></p>
      <label>日時<input id="editDateTime" type="datetime-local"></label>
      <p id="editError" class="error hidden"></p>
      <div class="modal-actions">
        <button id="saveEdit" class="btn primary" type="button">保存</button>
        <button id="deleteEdit" class="btn danger" type="button">削除</button>
        <button id="cancelEdit" class="btn" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="modal-backdrop" data-close-history></div>
    <div class="modal-panel">
      <h2 id="historyTitle">勤務詳細</h2>
      <div id="historyDetail"></div>
      <div class="modal-actions">
        <button id="deleteHistory" class="btn danger" type="button">履歴を削除</button>
        <button id="closeHistory" class="btn" type="button">閉じる</button>
      </div>
    </div>
  </div>


  <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <h2 id="confirmTitle">確認</h2>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmOk" class="btn danger" type="button">実行する</button>
        <button id="confirmCancel" class="btn" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
